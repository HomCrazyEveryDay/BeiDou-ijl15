[general]
;IME 修复方案，只有0和1两种，优先尝试方案1（更完美），如果会卡门再尝试方案0
imeType=1
;分辨率 (推荐值: 1280x720, 1366x768; 其他可选: 1600x900, 1920x1080, 1024x768; 不保证可用: 800x600)
width=1280
height=720
;服务器地址
ServerIP_Address=127.0.0.1
serverIP_Port=8484

[debug]
;崩溃时在客户端目录 crash/ 下生成 .dmp 和 .txt，方便定位客户端崩溃原因
enableCrashDump=true
;mini 体积小，优先用于线上反馈；需要更多内存现场时可临时改为 full
crashDumpType=mini
